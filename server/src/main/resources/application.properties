spring.application.name=conflux-server
server.shutdown=graceful
server.error.include-message=never
spring.mvc.problemdetails.enabled=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=true
management.info.build.enabled=true

conflux.environment=${CONFLUX_ENVIRONMENT:local}
conflux.allowed-origins=${CONFLUX_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
conflux.meet.reconnect-window-seconds=${CONFLUX_MEET_RECONNECT_WINDOW_SECONDS:120}
conflux.meet.inactive-room-timeout-minutes=${CONFLUX_MEET_INACTIVE_ROOM_TIMEOUT_MINUTES:30}

logging.pattern.level=%5p [trace:%X{traceId:-none}]
