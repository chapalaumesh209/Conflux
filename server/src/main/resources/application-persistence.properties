# This profile is intentionally opt-in: a dependency-ready service must not
# silently replace PostgreSQL/Redis with browser or in-memory state.
spring.datasource.url=${CONFLUX_DATABASE_URL:jdbc:postgresql://localhost:5432/conflux}
spring.datasource.username=${CONFLUX_DATABASE_USERNAME:conflux}
spring.datasource.password=${CONFLUX_DATABASE_PASSWORD:conflux_local_only}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

spring.data.redis.host=${CONFLUX_REDIS_HOST:localhost}
spring.data.redis.port=${CONFLUX_REDIS_PORT:6379}
spring.data.redis.timeout=2s

# Public STUN endpoints can be configured per environment. TURN credentials are
# generated by the signaling layer and must never be shipped to the browser.
conflux.media.stun-urls=${CONFLUX_STUN_URLS:}
