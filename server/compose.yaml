services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: conflux
      POSTGRES_USER: conflux
      POSTGRES_PASSWORD: conflux_local_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conflux -d conflux"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - conflux-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  conflux-postgres:
